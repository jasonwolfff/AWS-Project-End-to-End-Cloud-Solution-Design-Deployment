<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to Azubi Africa, </br>your gateway to learning and growth opportunities.">
  <title>Welcome to Azubi Africa</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #172b4d;
      background: #f5f8fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5eaf1;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      min-height: 72px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand {
      color: #123b70;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
    }

    nav ul {
      display: flex;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      color: #44546f;
      font-size: 0.95rem;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #087f8c;
    }

    main {
      display: grid;
      min-height: calc(100vh - 73px);
      place-items: center;
      padding: 48px 24px;
      text-align: center;
      background: linear-gradient(135deg, #e8f4f4, #f5f8fc 60%);
    }

    .welcome {
      max-width: 680px;
    }

    .welcome p {
      margin: 0 0 12px;
      color: #087f8c;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #123b70;
      font-size: clamp(2rem, 5.5vw, 3.5rem);
      line-height: 1.1;
    }

    @media (max-width: 480px) {
      nav {
        padding: 0 16px;
      }

      nav ul {
        gap: 14px;
      }

      nav a {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="#home">Azubi Africa</a>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
      </ul>
    </nav>
  </header>
  <main id="home">
    <section class="welcome" aria-labelledby="welcome-heading">
      <p>Learn. Grow. Lead.</p>
      <h1 id="welcome-heading">Welcome to Azubi Africa,<br>your gateway to learning and growth opportunities.</h1>
    </section>
  </main>
  <section id="about" class="about" aria-labelledby="about-heading">
    <h2 id="about-heading">About Azubi Africa</h2>
    <p>Discover opportunities to learn, grow, and build your future.</p>
  </section>
</body>
</html>
